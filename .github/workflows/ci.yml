name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Testes (app)
        run: npm test
      - name: Testes (pagamento, edge functions)
        run: node --experimental-strip-types supabase/functions/_shared/pagamento/pagamento.test.ts
      - name: Testes (anti-abuso, edge functions)
        run: node --experimental-strip-types supabase/functions/_shared/antiabuso.test.ts
