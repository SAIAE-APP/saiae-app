<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="app-theme-color" content="#FFC21A" />

    <!-- Rebrand "Sai aê" (redesign_ux_ui_app/saiae/DESIGN.md, 2026-09-26):
         Figtree (corpo/interface), Outfit (títulos e números) —
         substitui Hanken Grotesk/Space Grotesk do redesign "Speed Bento
         POS" anterior. Números tabulares em geral usam Outfit, rótulos
         de legenda usam Figtree 700 com tracking (ver
         src/styles/tokens.css). JetBrains Mono (2026-09-27): o site
         (saiae.com.br) mantém essa fonte pra um acento técnico pontual
         — cronômetro/timer chip da Cozinha replica o mesmo uso aqui,
         não é volta geral da Mono pra todo número. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <!-- Ícones: Material Symbols Rounded, peso 500, preenchido = ativo
         (ver src/components/ui/Icone.tsx). Variable font — a faixa FILL
         0..1 é o que liga/desliga o preenchimento por elemento. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" id="app-apple-icon" href="/icons/apple-touch-icon.png" />
    <title>Sai aê — Comanda digital para feira, food truck e lanchonete</title>
    <meta
      name="description"
      content="Comanda digital para feira, food truck, lanchonete, barraca e quiosque. Lance o pedido, acompanhe no kanban da cozinha e chame o cliente pela senha. Powered by AIA."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sai aê" />
    <meta property="og:url" content="https://saiae.com.br/" />

    <meta
      property="og:description"
      content="Comanda digital para feira, food truck, lanchonete, barraca e quiosque. Lance o pedido, acompanhe no kanban da cozinha e chame o cliente pela senha. Powered by AIA."
    />
    <meta property="og:image" content="https://saiae.com.br/brand/saiae-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
